name: Update README

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    concurrency:
      group: update-readme
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Install dependencies
        run: pnpm install
      - name: Run readme.ts
        run: node --experimental-transform-types ./src/readme.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Commits created through the Contents API are created (and signed) by
      # GitHub itself, so they satisfy the required_signatures ruleset rule
      # without managing any signing keys.
      - name: Commit README and open pull request via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          OWNER="${REPO%%/*}"
          BRANCH="update-readme"
          FILE="README.md"

          # Reset the working branch to master. It is not protected, so this is allowed.
          BASE_SHA="$(gh api "repos/$REPO/git/ref/heads/master" --jq .object.sha)"
          if gh api "repos/$REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            gh api --silent -X PATCH "repos/$REPO/git/refs/heads/$BRANCH" -f sha="$BASE_SHA" -F force=true
          else
            gh api --silent -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$BASE_SHA"
          fi

          # No-op when readme.ts produced no changes (also avoids empty commits).
          REMOTE_CONTENT="$(gh api "repos/$REPO/contents/$FILE?ref=$BRANCH" --jq '.content' | tr -d '\n')"
          LOCAL_CONTENT="$(base64 -w0 "$FILE")"
          if [ "$REMOTE_CONTENT" = "$LOCAL_CONTENT" ]; then
            echo "No README changes."
            exit 0
          fi

          BLOB_SHA="$(gh api "repos/$REPO/contents/$FILE?ref=$BRANCH" --jq '.sha')"
          gh api --silent -X PUT "repos/$REPO/contents/$FILE" \
            -f message="Update README" \
            -f content="$LOCAL_CONTENT" \
            -f sha="$BLOB_SHA" \
            -f branch="$BRANCH"

          PR_NUMBER="$(gh api "repos/$REPO/pulls?head=$OWNER:$BRANCH&state=open" --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="$(gh api -X POST "repos/$REPO/pulls" -f title="Update README" -f body="Automated README update." -f head="$BRANCH" -f base="master" --jq .number)"
          fi
          gh api --silent -X POST "repos/$REPO/issues/$PR_NUMBER/labels" -f "labels[]=ai:autofix"

          PR="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          if [ "$(echo "$PR" | jq -r '.state')" = "open" ] && [ "$(echo "$PR" | jq -r '.auto_merge | . != null')" = "false" ]; then
            gh api graphql \
              -f query='mutation($id: ID!) { enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) { clientMutationId } }' \
              -f id="$(echo "$PR" | jq -r .node_id)"
          fi